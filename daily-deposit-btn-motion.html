/**

 *   设计稿 299px → width: px2vw(299);
 *   编译 → width: calc(299 / 390 * 100vw);

 *   width: px2vw(299);
 *   @include breakpoint(md) {
 *     width: 299px;
 *   }
 */

.dailyDepositBtn .dailyDepositBtn-sweep {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.2) 47%, rgba(255, 255, 255, 0.5) 50%, rgba(255, 255, 255, 0.2) 53%, transparent 60%);
  transform: translateX(-100%);
  animation: daily-deposit-sweep-dwell 4s linear infinite;
}

@keyframes daily-deposit-sweep-dwell {
  0% {
    transform: translateX(-100%);
    animation-timing-function: ease-in-out;
  }
  40%, 100% {
    transform: translateX(100%);
  }
}
@keyframes daily-deposit-gift-shake {
  0%, 17.5% {
    transform: scale(1) rotate(0deg);
  }
  19.75% {
    transform: scale(1.01) rotate(-1.6deg);
  }
  22% {
    transform: scale(1.02) rotate(3.2deg);
  }
  24.25% {
    transform: scale(1.03) rotate(-4.8deg);
  }
  26.5% {
    transform: scale(1.04) rotate(6.4deg);
  }
  28.75% {
    transform: scale(1.05) rotate(-8deg);
  }
  31% {
    transform: scale(1.06) rotate(9.6deg);
  }
  33.25% {
    transform: scale(1.07) rotate(-11.2deg);
  }
  35.5% {
    transform: scale(1.08) rotate(12.8deg);
  }
  37.75% {
    transform: scale(1.09) rotate(-14.4deg);
  }
  40%, 100% {
    transform: scale(1) rotate(0deg);
  }
}
@keyframes daily-deposit-btn-pulse {
  0%, 40% {
    scale: 1;
  }
  44% {
    scale: 1.04;
  }
  48.75%, 100% {
    scale: 1;
